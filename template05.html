<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan — {{ groom_name }} &amp; {{ bride_name }}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #1a231e;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
            color: #2c352e;
        }
        .invitation-container {
            max-width: 430px;
            margin: 0 auto;
            background: #FAF8F5;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            position: relative;
        }
        .font-cormorant {
            font-family: 'Cormorant Garamond', serif;
        }
        .font-italianno {
            font-family: 'Italianno', cursive;
        }
        
        /* Utility Section Style */
        .section-page {
            position: relative;
            width: 100%;
            min-height: 850px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 64px 28px;
            overflow: hidden;
        }
        
        /* Luxury Ornaments & Gradients */
        .romantic-bg {
            position: absolute; width: 100%; height: 100%; left: 0; top: 0;
            background-size: cover; background-position: center; z-index: 0;
        }
        .photographic-scrim {
            position: absolute; width: 100%; height: 100%; left: 0; top: 0;
            background: linear-gradient(180deg, rgba(26, 35, 30, 0.65) 0%, rgba(26, 35, 30, 0.2) 40%, rgba(26, 35, 30, 0.4) 70%, rgba(26, 35, 30, 0.95) 100%);
            z-index: 1;
        }
        .portrait-frame {
            box-sizing: border-box; position: absolute; width: calc(100% - 32px); height: calc(100% - 32px);
            left: 16px; top: 16px; opacity: 0.6; border: 0.8px solid #d4af37; pointer-events: none; z-index: 2;
        }
        .fine-ornament {
            display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 12px; width: 100%; margin: 12px 0;
        }
        .fine-rule { width: 40px; height: 1px; background: #d4af37; }
        .diamond { width: 4px; height: 4px; background: #d4af37; transform: rotate(45deg); }

        /* ========== GALERI CAROUSEL ========== */
        .carousel-container {
            width: 100%;
            max-width: 374px;
            overflow: hidden;
            position: relative;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-top: 20px;
        }
        .carousel-track {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .carousel-slide {
            min-width: 100%;
            height: 380px;
            background-size: cover;
            background-position: center;
        }
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(44, 53, 46, 0.7);
            color: #f4ece1;
            border: none;
            width: 36px; height: 36px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 5;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.3s;
        }
        .carousel-btn:hover { background: rgba(44, 53, 46, 0.9); }
        .carousel-btn.prev { left: 12px; }
        .carousel-btn.next { right: 12px; }
        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 14px;
        }
        .carousel-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #d4af3755;
            cursor: pointer;
            transition: background 0.3s;
        }
        .carousel-dot.active { background: #d4af37; width: 18px; border-radius: 3px; }

        /* ========== RSVP FORM ========== */
        .form-card { width: 100%; max-width: 374px; display: flex; flex-direction: column; gap: 14px; background: #ffffff; padding: 24px; border-radius: 8px; border: 1px solid #e6e2d8; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; }
        .form-group label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: #74766b; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px 14px; background: #FAF8F5; border: 1px solid #e2ddd0; border-radius: 4px; font-family: inherit; font-size: 13px; color: #2c352e; outline: none; transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #b8a17a;
        }
